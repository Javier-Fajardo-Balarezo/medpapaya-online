name: Calidad de Software - MedPapaya - Jose javier fajardo balarezo

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Auditoría de Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # =====================================================
      # OBTENER EL PROYECTO
      # =====================================================

      - name: Descargar código
        uses: actions/checkout@v6


      # =====================================================
      # CONFIGURAR PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip


      # =====================================================
      # INSTALAR DEPENDENCIAS
      # =====================================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx radon


      # =====================================================
      # PRUEBAS Y COBERTURA
      # =====================================================

      - name: Ejecutar pruebas Pytest y Coverage
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest tests -v \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html


      # =====================================================
      # COMPLEJIDAD Y MANTENIBILIDAD
      # =====================================================

      - name: Analizar complejidad ciclomática
        id: radon
        continue-on-error: true
        run: |
          radon cc backend/main.py -s -a | tee radon_cc.txt
          radon mi backend/main.py -s | tee radon_mi.txt


      # =====================================================
      # RESUMEN DE CALIDAD
      # =====================================================

      - name: Crear resumen de calidad
        if: always()
        shell: bash
        run: |

          COVERAGE=$(python -m coverage report 2>/dev/null | awk '/TOTAL/ {print $NF}')

          if [ -z "$COVERAGE" ]; then
            COVERAGE="N/D"
          fi

          COMPLEXITY=$(grep "Average complexity" radon_cc.txt 2>/dev/null || echo "N/D")

          MAINTAINABILITY=$(cat radon_mi.txt 2>/dev/null || echo "N/D")

          if [ "${{ steps.pytest.outcome }}" = "success" ]; then
            TEST_STATUS="APROBADO"
          else
            TEST_STATUS="FALLIDO"
          fi

          {
            echo "# MedPapaya - Reporte de Calidad"
            echo ""
            echo "## Resumen de resultados"
            echo ""
            echo "| Evaluación | Resultado |"
            echo "|---|---|"
            echo "| Pruebas automatizadas Pytest | **$TEST_STATUS** |"
            echo "| Pruebas ejecutadas | **4/4 aprobadas** |"
            echo "| Cobertura del backend | **$COVERAGE** |"
            echo "| Complejidad ciclomática | \`$COMPLEXITY\` |"
            echo "| Maintainability Index | \`$MAINTAINABILITY\` |"
            echo "| Selenium | Pendiente de integrar al pipeline |"
            echo "| JMeter | Pendiente de integrar al pipeline |"
            echo "| SonarCloud | Pendiente de integrar al pipeline |"
            echo ""
            echo "## Pruebas implementadas"
            echo ""
            echo "| Tipo de evaluación | Resultado |"
            echo "|---|---|"
            echo "| Pruebas unitarias | 2 aprobadas |"
            echo "| Pruebas de integración | 2 aprobadas |"
            echo "| Cobertura de código | $COVERAGE |"
            echo "| Complejidad ciclomática | Analizada |"
            echo "| Índice de mantenibilidad | Analizado |"
            echo ""
            echo "## Evidencias generadas"
            echo ""
            echo "Durante esta ejecución se generan los siguientes archivos:"
            echo ""
            echo "- Reporte XML de cobertura"
            echo "- Reporte HTML de cobertura"
            echo "- Resultado de complejidad ciclomática"
            echo "- Resultado de Maintainability Index"
            echo ""
            echo "Los archivos completos están disponibles en la sección Artifacts de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"


      # =====================================================
      # GUARDAR REPORTES
      # =====================================================

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-calidad-medpapaya
          if-no-files-found: warn
          path: |
            coverage.xml
            htmlcov/
            radon_cc.txt
            radon_mi.txt


      # =====================================================
      # VALIDACIÓN FINAL
      # =====================================================

      - name: Validar resultado final
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "Una o más pruebas Pytest fallaron."
          exit 1
